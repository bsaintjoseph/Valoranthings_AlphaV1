      // Slideshow script

      function showSlides() {
          let i;
          const slides = document.getElementsByClassName("mySlides");
          const dots = document.getElementsByClassName("dot");
          for (i = 0; i < slides.length; i++) {
              slides[i].style.display = "none";
          }
          slideIndex++;
          if (slideIndex > slides.length) {
              slideIndex = 1;
          }
          for (i = 0; i < dots.length; i++) {
              dots[i].className = dots[i].className.replace(" active", "");
          }
          slides[slideIndex - 1].style.display = "block";
          dots[slideIndex - 1].className += " active";
          setTimeout(showSlides, 5000); // Change image every 5 seconds
      }

// Function to fade in an element
function fadeIn(element) {
  element.style.opacity = 0;
  let opacity = 0;
  const fadeInInterval = setInterval(function() {
      if (opacity < 1) {
          opacity += 0.05; // Adjust the increment value to control fade speed
          element.style.opacity = opacity;
      } else {
          clearInterval(fadeInInterval);
      }
  }, 50); // Adjust the interval value to control fade speed
}

    let currentQuestion = 0;

    const quizContainer = document.getElementById('quiz');
    const questionElement = document.getElementById('question');
    const option1 = document.getElementById('option1');
    const option2 = document.getElementById('option2');
    const option3 = document.getElementById('option3');
    const option4 = document.getElementById('option4');
    const submitBtn = document.getElementById('submitBtn');
    const resultContainer = document.getElementById('result');

    function loadQuestion() {
      const currentQuestionData = questions[currentQuestion];
      questionElement.textContent = currentQuestionData.question;
      option1.textContent = currentQuestionData.options[0];
      option2.textContent = currentQuestionData.options[1];
      option3.textContent = currentQuestionData.options[2];
      option4.textContent = currentQuestionData.options[3];
    }

    function checkAnswer() {
      const selectedOption = document.querySelector('input[name="option"]:checked');
      if (!selectedOption) {
        alert('Please select an option');
        return;
      }
      
      const answer = parseInt(selectedOption.value);
      if (answer === questions[currentQuestion].answer) {
        score++;
      }
      
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      quizContainer.style.display = 'none';
      resultContainer.textContent = `You scored ${score} out of ${questions.length}`;
    }

    loadQuestion();

    submitBtn.addEventListener('click', checkAnswer);
